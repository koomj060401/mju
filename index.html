show{opacity:1;transform:translate(-50%,0)}.toast-dot{height:7px;width:7px;border-radius:50%;background:#4ade80}.toast.error .toast-dot{background:#f87171}.detail-empty{padding:34px 20px;text-align:center;color:#64748b;font-size:13px;border:1px dashed #cbd5e1;border-radius:10px;background:white}.detail-empty strong{display:block;color:#334155;margin-bottom:5px}.hidden{display:none!important}.footer-note{text-align:center;color:#94a3b8;font-size:11px;margin-top:42px}.search-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}.search-box{position:relative;flex:1}.search-box svg{position:absolute;top:10px;left:11px;color:#94a3b8}.search-box .input{padding-left:34px}.count-label{font-size:11px;color:#94a3b8;white-space:nowrap}

<body>
  <header class="topbar">
    <a href="#" class="brand" id="brandHome" aria-label="Lab Note 홈">
      <span class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5l-5.4 9.1A2.2 2.2 0 0 0 6.5 22h11a2.2 2.2 0 0 0 1.9-3.4L14 9.5V3"/><path d="M7.7 16h8.6"/></svg></span>
      <span><span class="brand-name">Lab Note</span><span class="brand-sub">실험 기록을 정돈하는 가장 간단한 방법</span></span>
    </a>
    <nav class="nav" aria-label="주 메뉴"><button id="navExperiments" class="active">내 실험 목록</button><button id="navGuide">사용 가이드</button></nav>
    <div class="top-right"><span class="sync"><i class="sync-dot"></i>이 브라우저에 자동 저장</span><span class="avatar" aria-label="개인 노트">노</span></div>
  </header>
  <main id="app" class="shell"></main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"><i class="toast-dot"></i><span id="toastText">저장되었습니다.</span></div>
  <script>
    (()=>{
      const KEY='lab-note-v1', SEED_KEY='lab-note-seeded-v1';
      const CHECKS=['참고자료의 출처를 확인했는가?','조교가 강조한 사항을 레포트에 반영했는가?','실제 실험에서 변경된 내용을 반영했는가?','실험 결과와 오차원인을 검토했는가?'];
      const TYPES=['교재','논문','웹사이트','기타'];
      const seeds=[
        {name:'산화·환원 반응의 이해',course:'일반화학 실험',description:'과망간산 칼륨을 이용한 산화·환원 적정',resources:[{title:'과망간산 칼륨 적정법의 원리',type:'교재',url:'',note:'적정 종말점에서 옅은 분홍색이 30초 이상 유지되면 반응이 완료된 것으로 판단한다.',createdAt:Date.now()-86400000}],notes:{ta:'종말점에서 연한 분홍색이 30초 이상 유지되는지 확인. 적정 초반에는 한 방울씩 천천히 떨어뜨릴 것.',method:'실제 시료 부피가 계획한 25 mL가 아닌 20 mL로 조정됨.',result:'2회차 적정 결과가 1회차보다 약 0.12 mL 차이남. 뷰렛 눈금 읽을 때 시차 가능성 점검.'},checks:[true,true,false,false]},
        {name:'에스터화 반응과 향료 합성',course:'유기화학 실험',description:'아세트산과 에탄올의 에스터화 반응',resources:[],notes:{ta:'',method:'',result:''},checks:[false,false,false,false]},
        {name:'열량계를 이용한 반응열 측정',course:'물리화학 실험',description:'중화 반응으로부터 몰 반응열 계산',resources:[],notes:{ta:'',method:'',result:''},checks:[false,false,false,false]}
      ];
      let data=load(), view='list', activeId=null, tab='resources', editingId=null, toastTimer;
      const app=document.getElementById('app'), modalRoot=document.getElementById('modalRoot');
      function uid(){return 'e_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
      function load(){try{let raw=localStorage.getItem(KEY),parsed=raw?JSON.parse(raw):null;if(Array.isArray(parsed)&&parsed.length)return parsed;if(localStorage.getItem(SEED_KEY)==='1')return [];localStorage.setItem(SEED_KEY,'1')}catch(e){}return seeds.map((x,i)=>({...x,id:'sample_'+i,createdAt:Date.now()-(i*86400000),updatedAt:Date.now()-(i*86400000)}))}
      function save(silent=false){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(SEED_KEY,'1');if(!silent)toast('저장되었습니다.')}catch(e){toast('저장에 실패했습니다. 다시 시도해주세요.',true);return false}return true}
      function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function date(ts){return new Intl.DateTimeFormat('ko-KR',{month:'short',day:'numeric'}).format(new Date(ts||Date.now()))}
      function fullDate(ts){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(ts||Date.now()))}
      function expById(id){return data.find(x=>x.id===id)}
      function completion(exp){return Math.round(((exp.checks||[]).filter(Boolean).length/4)*100)}
      function hasNote(exp){return !!exp.notes&&Object.values(exp.notes).some(x=>String(x||'').trim())}
      function status(exp){const p=completion(exp);return p===100?['완료','green']:p>0||hasNote(exp)||exp.resources.length?['진행 중','blue']:['작성 초기','gray']}
      function toast(msg,error=false){const el=document.getElementById('toast');document.getElementById('toastText').textContent=msg;el.classList.toggle('error',error);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
      function setNav(which){document.getElementById('navExperiments').classList.toggle('active',which==='list'||which==='detail');document.getElementById('navGuide').classList.toggle('active',which==='guide')}
      function goList(){view='list';activeId=null;setNav('list');render()}
      function goDetail(id){activeId=id;view='detail';tab='resources';setNav('detail');render()}
      function render(){if(view==='guide'){setNav('guide');renderGuide()}else if(view==='detail'){const e=expById(activeId);if(!e){goList();return}renderDetail(e)}else renderList()}
      function renderList(){setNav('list');const totalResources=data.reduce((n,e)=>n+e.resources.length,0),active=data.filter(e=>completion(e)<100).length,ready=data.filter(e=>completion(e)===100).length;
        app.innerHTML=`<section class="page-heading"><div><div class="eyebrow"><span>✳</span> MY LABORATORY</div><h1 class="page-title">실험 노트</h1><p class="page-lede">자료와 실험의 순간을 한곳에 모아, 더 정확한 레포트를 준비하세요.</p></div><button class="primary" id="addExperiment"><span style="font-size:17px;line-height:12px">+</span> 새 실험 추가</button></section>

      function resourcesView(e){return `<div class="content-grid"><div><div class="panel"><div class="panel-title"><div><h2>${editingId?'자료 수정':'새 참고자료'}</h2><p>자료의 출처와 핵심 내용을 기록해두세요.</p></div><span class="badge blue">${e.resources.length}건 등록</span></div><form id="resourceForm" novalidate><div class="form-group"><label class="form-label" for="resourceTitle">자료 제목 <small>필수 · 최대 100자</small></label><input class="input" id="resourceTitle" name="title" maxlength="100" placeholder="예: 산화·환원 적정의 기본 원리" required /></div><div class="form-group"><label class="form-label" for="resourceType">출처 유형 <small>선택</small></label><select class="select" id="resourceType" name="type"><option value="">유형 선택</option>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="resourceUrl">URL <small>선택</small></label><input class="input" id="resourceUrl" name="url" type="url" placeholder="https://example.com/article" /></div><div class="form-group"><label class="form-label" for="resourceNote">핵심 내용 <span class="char-count" id="resourceNoteCount">0 / 1000자</span></label><textarea class="textarea" id="resourceNote" name="note" maxlength="1000" placeholder="자료에서 레포트에 참고할 내용을 요약해보세요."></textarea></div><div id="resourceError" aria-live="polite"></div><div class="form-actions">${editingId?'<button type="button" class="secondary" id="cancelEdit">취소</button>':''}<button class="primary" type="submit">${editingId?'수정 내용 저장':'자료 저장'} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 4 4L19 6"/></svg></button></div></form></div></div><aside class="panel side-panel"><h3>자료 정리 팁</h3><div class="side-item"><div class="side-item-label"><span style="color:#1d4ed8">◉</span>출처를 함께 기록하세요</div><p class="side-item-value">나중에 인용 정보를 찾기 쉽도록 URL과 출처 유형을 남겨두면 편리해요.</p></div><div class="side-item"><div class="side-item-label"><span style="color:#1d4ed8">◉</span>핵심만 짧게 정리하세요</div><p class="side-item-value">레포트에 필요한 개념과 근거를 간단히 메모해보세요.</p></div><div class="side-item"><div class="side-item-label"><span style="color:#16a34a">✓</span>이 실험에만 저장됩니다</div><p class="side-item-value">다른 실험의 자료와 섞이지 않아 안전하게 관리할 수 있어요.</p></div></aside></div><div class="section-head"><h2>저장한 참고자료</h2><span>${e.resources.length}건</span></div>${e.resources.length?`<div class="resource-list">${e.resources.map((r,i)=>`<article class="resource-card"><div class="resource-top"><span class="badge ${r.type==='논문'?'blue':r.type==='교재'?'gray':'gray'}">${esc(r.type||'기타')} <span style="opacity:.6;margin-left:5px">· ${String(i+1).padStart(2,'0')}</span></span><div class="resource-actions"><button class="icon-button" title="수정" aria-label="${esc(r.title)} 수정" data-edit-resource="${esc(r.id)}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m16 4 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button><button class="icon-button" title="삭제" aria-label="${esc(r.title)} 삭제" data-delete-resource="${esc(r.id)}" style="color:#94a3b8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></div><h3>${esc(r.title)}</h3>${r.url?`<a class="resource-url" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3h7v7m0-7-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>${esc(r.url)}</a>`:''}${r.note?`<div class="resource-note">${esc(r.note)}</div>`:''}<div class="resource-footer">저장일 · ${fullDate(r.createdAt)}</div></article>`).join('')}</div>`:`<div class="detail-empty"><strong>등록된 참고자료가 없습니다</strong>찾아본 자료를 추가하면 이곳에서 확인할 수 있어요.</div>`}`}
      function notesView(e){let n=e.notes||{};return `<div class="content-grid"><div><form id="notesForm" novalidate><article class="panel note-block" style="border-left:3px solid #d97706"><div class="note-title"><i class="note-dot"></i>조교 강조사항 <span style="margin-left:auto" class="char-count" id="taCount">${(n.ta||'').length} / 2000자</span></div><textarea class="textarea large" name="ta" maxlength="2000" placeholder="조교가 특히 강조한 내용이나 주의사항을 기록하세요.">${esc(n.ta||'')}</textarea></article><article class="panel note-block" style="border-left:3px solid #2563eb"><div class="note-title"><i class="note-dot blue"></i>변경된 실험 방법 <span style="margin-left:auto" class="char-count" id="methodCount">${(n.method||'').length} / 2000자</span></div><textarea class="textarea large" name="method" maxlength="2000" placeholder="실제 실험에서 계획과 달라진 과정을 기록하세요.">${esc(n.method||'')}</textarea></article><article class="panel note-block" style="border-left:3px solid #16a34a"><div class="note-title"><i class="note-dot green"></i>실험 결과 및 특이사항 <span style="margin-left:auto" class="char-count" id="resultCount">${(n.result||'').length} / 2000자</span></div><textarea class="textarea large" name="result" maxlength="2000" placeholder="주요 관찰 결과와 오차, 특이사항을 기록하세요.">${esc(n.result||'')}</textarea></article><div id="noteError" aria-live="polite" style="margin:0 0 10px"></div><div style="display:flex;justify-content:flex-end"><button class="primary" type="submit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h12l3 3v13H4V4z"/><path d="M8 4v5h8V4M8 20v-7h8v7"/></svg>메모 저장</button></div></form></div><aside class="panel side-panel"><h3>메모 작성 안내</h3><div class="side-item"><div class="side-item-label"><span style="color:#d97706">●</span>조교 강조사항</div><p class="side-item-value">레포트에 꼭 반영해야 하는 주의점과 채점 포인트를 적어두세요.</p></div><div class="side-item"><div class="side-item-label"><span style="color:#2563eb">●</span>실험 방법 변경</div><p class="side-item-value">계획한 방법과 실제 진행이 달랐던 부분을 기록하세요.</p></div><div class="side-item"><div class="side-item-label"><span style="color:#16a34a">●</span>결과 및 특이사항</div><p class="side-item-value">수치, 관찰 내용과 오차 원인을 함께 남겨두면 좋아요.</p></div></aside></div>`}
      function checklistView(e){let done=(e.checks||[]).filter(Boolean).length;return `<div class="content-grid"><div class="panel"><div class="panel-title"><div><h2>레포트 작성 전 확인하기</h2><p>모든 항목이 레포트에 반영되었는지 확인해보세요.</p></div><span class="badge ${done===4?'green':'blue'}">${done===4?'준비 완료':'확인 중'}</span></div><div class="checklist-grid">${CHECKS.map((c,i)=>`<label class="check-row ${(e.checks||[])[i]?'checked':''}"><input type="checkbox" data-check="${i}" ${(e.checks||[])[i]?'checked':''}><span><span class="check-title">${c}</span><span class="check-hint">${['사용한 자료와 인용 정보를 한 번 더 확인해요.','메모해둔 조교의 주의사항을 빠뜨리지 않았는지 확인해요.','계획과 다른 방법을 정확하게 기재했는지 확인해요.','결과의 유효 숫자와 오차 원인을 검토해요.'][i]}</span></span></label>`).join('')}</div><div class="check-footer"><div><div class="check-footer-label">레포트 준비 상태</div><div class="check-footer-value">${done}개 중 ${4-done}개 남았어요</div></div><div class="check-progress"><div class="progress-label"><span>진행률</span><span>${done*25}%</span></div><div class="progress"><i style="width:${done*25}%;${done===4?'background:#16a34a':''}"></i></div></div></div></div><aside class="panel side-panel"><h3>기록 요약</h3><div class="side-item"><div class="side-item-label">참고자료</div><p class="side-item-value">${e.resources.length}건 ${e.resources.length?'저장됨':'등록된 자료 없음'}</p></div><div class="side-item"><div class="side-item-label">실험 메모</div><p class="side-item-value">${hasNote(e)?'메모 작성됨':'아직 작성하지 않았어요'}</p></div><div class="side-item"><div class="side-item-label">모든 변경 사항은 자동 저장돼요</div><p class="side-item-value">체크를 누르면 바로 이 브라우저에 저장됩니다.</p></div></aside></div>`}
      function wireTab(e){const form=document.getElementById('resourceForm');if(form){const note=form.elements.note;note.oninput=()=>document.getElementById('resourceNoteCount').textContent=`${note.value.length} / 1000자`;if(editingId){const r=e.resources.find(x=>x.id===editingId);if(r){form.elements.title.value=r.title;form.elements.type.value=r.type||'';form.elements.url.value=r.url||'';note.value=r.note||'';note.oninput()}}form.onsubmit=ev=>{ev.preventDefault();const title=form.elements.title.value.trim(),url=form.elements.url.value.trim(),err=document.getElementById('resourceError');err.innerHTML='';form.elements.title.classList.remove('input-error');form.elements.url.classList.remove('input-error');if(!title){form.elements.title.classList.add('input-error');err.innerHTML='<p class="field-error">자료 제목을 입력해주세요.</p>';form.elements.title.focus();return}if(title.length>100||note.value.length>1000){err.innerHTML='<p class="field-error">입력 가능한 글자 수를 초과했습니다.</p>';return}if(url){try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw 0}catch{form.elements.url.classList.add('input-error');err.innerHTML='<p class="field-error">올바른 URL을 입력해주세요.</p>';form.elements.url.focus();return}}const r={title,type:form.elements.type.value,url,note:note.value.trim()};if(editingId){let old=e.resources.find(x=>x.id===editingId);Object.assign(old,r);editingId=null}else e.resources.unshift({...r,id:uid(),createdAt:Date.now()});e.updatedAt=Date.now();save();renderDetail(e)}}
        const cancel=document.getElementById('cancelEdit');if(cancel)cancel.onclick=()=>{editingId=null;renderDetail(e)};

        const nf=document.getElementById('notesForm');if(nf){[['ta','taCount'],['method','methodCount'],['result','resultCount']].forEach(([name,id])=>{nf.elements[name].oninput=()=>document.getElementById(id).textContent=`${nf.elements[name].value.length} / 2000자`});nf.onsubmit=ev=>{ev.preventDefault();const notes={ta:nf.elements.ta.value.trim(),method:nf.elements.method.value.trim(),result:nf.elements.result.value.trim()};const err=document.getElementById('noteError');err.innerHTML='';if(!Object.values(notes).some(Boolean)){err.innerHTML='<p class="field-error">메모를 한 항목 이상 작성해주세요.</p>';nf.elements.ta.focus();return}e.notes=notes;e.updatedAt=Date.now();save();renderDetail(e)}}
        app.querySelectorAll('[data-check]').forEach(input=>input.onchange=()=>{e.checks=e.checks||[false,false,false,false];e.checks[Number(input.dataset.check)]=input.checked;e.updatedAt=Date.now();save(true);toast('체크리스트가 저장되었습니다.');renderDetail(e)})
      }
      function openExperimentModal(e=null){const editing=!!e;modalRoot.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><div><h2 id="modalTitle">${editing?'실험 정보 수정':'새 실험 추가'}</h2><p>${editing?'실험의 기본 정보를 수정합니다.':'새 노트를 만들어 실험 기록을 시작해보세요.'}</p></div><button class="modal-close" id="modalClose" aria-label="닫기">×</button></div><form id="experimentForm" novalidate><div class="form-group"><label class="form-label" for="expName">실험명 <small>필수 · 1~60자</small></label><input class="input" id="expName" name="name" maxlength="60" placeholder="예: 산화·환원 반응의 이해" required value="${editing?esc(e.name):''}" /></div><div class="form-group"><label class="form-label" for="expCourse">과목명 <small>선택</small></label><input class="input" id="expCourse" name="course" maxlength="60" placeholder="예: 일반화학 실험" value="${editing?esc(e.course||''):''}" /></div><div class="form-group"><label class="form-label" for="expDescription">한 줄 설명 <small>선택 · 최대 120자</small></label><input class="input" id="expDescription" name="description" maxlength="120" placeholder="이번 실험에서 다루는 내용을 적어보세요." value="${editing?esc(e.description||''):''}" /></div><div id="expError" aria-live="polite"></div><div class="modal-footer">${editing?'<button type="button" class="danger-button button-small" id="modalDelete">실험 삭제</button>':''}<div class="modal-footer-right"><button type="button" class="secondary" id="modalCancel">취소</button><button class="primary" type="submit">${editing?'변경사항 저장':'실험 추가'}</button></div></div></form></div></div>`;
        const close=()=>modalRoot.innerHTML='';document.getElementById('modalClose').onclick=close;document.getElementById('modalCancel').onclick=close;document.getElementById('modalBackdrop').onclick=ev=>{if(ev.target.id==='modalBackdrop')close()};document.getElementById('modalDelete')?.addEventListener('click',()=>{close();confirmDelete(e)});const input=document.getElementById('expName');input.focus();document.getElementById('experimentForm').onsubmit=ev=>{ev.preventDefault();const name=input.value.trim(),err=document.getElementById('expError');err.innerHTML='';input.classList.remove('input-error');if(!name){input.classList.add('input-error');err.innerHTML='<p class="field-error">실험명을 입력해주세요.</p>';input.focus();return}if(name.length>60){err.innerHTML='<p class="field-error">입력 가능한 글자 수를 초과했습니다.</p>';return}const f=ev.target;if(editing){e.name=name;e.course=f.elements.course.value.trim();e.description=f.elements.description.value.trim();e.updatedAt=Date.now()}else{const ne={id:uid(),name,course:f.elements.course.value.trim(),description:f.elements.description.value.trim(),resources:[],notes:{ta:'',method:'',result:''},checks:[false,false,false,false],createdAt:Date.now(),updatedAt:Date.now()};data.unshift(ne)}save();close();render()};document.onkeydown=ev=>{if(ev.key==='Escape'&&modalRoot.innerHTML){close();document.onkeydown=null}};
      }
      function confirmDelete(e){if(confirm(`“${e.name}” 실험과 저장된 모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)){data=data.filter(x=>x.id!==e.id);save();goList()}}
      function renderGuide(){app.innerHTML=`<section class="page-heading"><div><div class="eyebrow"><span>✳</span> QUICK GUIDE</div><h1 class="page-title">Lab Note 사용 가이드</h1><p class="page-lede">실험별 기록을 정리하고 레포트를 준비하는 방법을 안내합니다.</p></div><button class="secondary" id="guideBack"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg>내 실험으로 돌아가기</button></section><section class="guide-grid"><article class="panel guide-card"><span class="guide-number">01</span><h3>실험을 추가하세요</h3><p>실험 목록에서 새 실험을 만들고 실험명과 과목 정보를 적어보세요. 각 실험 기록은 서로 분리되어 관리됩니다.</p></article><article class="panel guide-card"><span class="guide-number">02</span><h3>참고자료를 모아보세요</h3><p>교재, 논문, 웹사이트의 제목과 URL, 핵심 내용을 저장하면 레포트 작성 중 출처를 다시 찾기 쉬워요.</p></article><article class="panel guide-card"><span class="guide-number">03</span><h3>실험의 순간을 기록하세요</h3><p>조교 강조사항, 변경된 방법, 결과와 특이사항을 기록해 실제 실험 과정이 빠짐없이 반영되도록 해요.</p></article></section><section class="guide-grid" style="margin-top:14px"><article class="panel guide-card"><span class="guide-number">04</span><h3>체크리스트를 확인하세요</h3><p>레포트에 필요한 네 가지 항목을 확인하고 체크하세요. 준비 상태와 완료 개수가 실험별로 저장됩니다.</p></article><article class="panel guide-card"><span class="guide-number">05</span><h3>기록은 자동으로 보존돼요</h3><p>실험 자료와 메모는 사용 중인 브라우저의 저장 공간에 저장됩니다. 새로고침 후에도 내용을 확인할 수 있어요.</p></article><article class="panel guide-card"><span class="guide-number">06</span><h3>출처를 직접 확인하세요</h3><p>저장한 자료의 신뢰성과 정확성을 검토하고, 최종 레포트에는 수업의 인용 기준을 따라 표시해주세요.</p></article></section><div class="guide-note"><strong>알아두세요</strong> — 데이터는 이 브라우저에 저장되며 다른 기기와 동기화되지 않습니다. 브라우저 데이터 삭제 시 기록도 사라질 수 있어요.</div><div class="footer-note">Lab Note는 기록과 정리를 돕는 개인 노트입니다.</div>`;document.getElementById('guideBack').onclick=goList}
      document.getElementById('navExperiments').onclick=goList;document.getElementById('navGuide').onclick=()=>{view='guide';render()};document.getElementById('brandHome').onclick=ev=>{ev.preventDefault();goList()};render();
    })();
  </script>
</body>
